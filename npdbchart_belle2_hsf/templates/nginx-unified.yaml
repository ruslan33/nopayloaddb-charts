apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  lookupPolicy:
    local: true
  tags:
    - name: {{ .Values.nginx_docker_image | splitList ":" | last | quote }}
      from:
        kind: DockerImage
        name: {{ .Values.nginx_docker_image }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx-conf
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;

    worker_rlimit_nofile 8192;

    events {
        worker_connections 4096;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main_with_cache '$remote_addr - $remote_user [$time_local] '
                                    '"$request" $status $body_bytes_sent '
                                    '"$http_referer" "$http_user_agent" '
                                    '$upstream_cache_status';

        access_log /dev/stdout main_with_cache;
        error_log /dev/stderr warn;

        # Shared Cache Configuration
        proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=my_cache:50m max_size=500m inactive=1h use_temp_path=off;

        # Clients can skip the cache for a single request by sending
        # "Cache-Control: no-cache" (or "X-No-Cache: 1"); the request is
        # proxied to Django and the fresh response replaces the cached entry.
        map $http_cache_control $client_cache_bypass {
            default 0;
            ~*no-cache 1;
        }

        # Django API Upstream
        upstream django {
            server {{ include "npdbchart.fullname" . }}-django.{{ .Values.project }}.svc.cluster.local:8000 max_conns=2000;
        }

        client_max_body_size 100M;

        # --- Metadata API Proxy ---
        server {
            listen 8080;
            server_name {{ .Values.appname }}.{{ .Values.domain }};

            proxy_hide_header Cache-Control;
            add_header Cache-Control {{ .Values.nginx_cache_control_value | quote }};
            add_header X-Cache-Status $upstream_cache_status;
            proxy_cache my_cache;
            proxy_cache_bypass $client_cache_bypass $http_x_no_cache;
            proxy_ignore_headers "Cache-Control" "Expires";

            proxy_read_timeout 1800;
            proxy_connect_timeout 1800;
            proxy_send_timeout 1800;

            location /api/cdb_rest/gtstatus {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 1h;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            # Readable alias for gtstatus (same view in cdb_rest/urls.py).
            # Exact match so /api/cdb_rest/global-tags/<name> lookups are
            # not caught by this location.
            location = /api/cdb_rest/global-tags/statuses {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 1h;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            location /api/cdb_rest/globalTags {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 1s;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            # Payload IOV queries, e.g.
            # /api/cdb_rest/payloadiovs/?gtName=X&majorIOV=N&minorIOV=M.
            # The query string is part of the cache key, so each
            # gt/IOV combination is cached separately.
            location = /api/cdb_rest/payloadiovs/ {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 10s;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            # Readable alias for payloadiovs (same view in cdb_rest/urls.py).
            location = /api/cdb_rest/payload-iovs/query/ {
                proxy_pass http://django;
                proxy_redirect off;
                proxy_cache_valid 200 302 10s;
                proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            }

            location /dbstore {
                root /usr/share/nginx/html;
                proxy_hide_header Cache-Control;
                add_header Cache-Control {{ .Values.nginx_cache_control_value | quote }};
                limit_except GET HEAD PUT {
                    deny all;
                }
                # Uploads must be authorized by the CDB API before nginx
                # writes the file; reads stay unauthenticated.
                if ($request_method = PUT) {
                    rewrite ^ /_dbstore_put$uri last;
                }
            }

            # Upload handler: PUT /dbstore/... requests land here via the
            # rewrite above (not reachable from outside). The file is written
            # by the WebDAV module only after auth_request approves the
            # request; nginx answers 201/204 on success.
            location /_dbstore_put/dbstore/ {
                internal;
                auth_request /_cdb_auth_decision;
                # Strip the /_dbstore_put prefix so the file is stored under
                # the same path it is later served from.
                rewrite ^/_dbstore_put(/.*)$ $1 break;
                root /usr/share/nginx/html;
                dav_methods PUT;
                # Create missing intermediate directories on upload.
                create_full_put_path on;
                dav_access group:rw all:r;
            }

            # Authorization subrequest for uploads: asks the CDB API whether
            # this request may proceed. The API returns 200 to allow; on PUT
            # it validates the client's JWT (Authorization header, forwarded
            # automatically) and the permission plugin, answering 401/403 to
            # deny — nginx then rejects the upload with that status.
            location = /_cdb_auth_decision {
                internal;
                # Auth decisions must never be served from the proxy cache.
                proxy_cache off;
                proxy_pass http://django/api/cdb_rest/auth/decision;
                # The decision needs headers only, not the uploaded file body.
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                # The API bases its decision on the original method and URI.
                proxy_set_header X-Original-Method $request_method;
                proxy_set_header X-Original-URI $request_uri;
            }

            location / {
                proxy_pass http://django;
                proxy_redirect off;
            }
        }

        # --- Payload Server ---
        server {
            listen 8080;
            server_name {{ .Values.appname_files }}.{{ .Values.domain }};

            location /dbstore {
                root /usr/share/nginx/html;
                proxy_hide_header Cache-Control;
                add_header Cache-Control {{ .Values.nginx_cache_control_value | quote }};
                limit_except GET HEAD PUT {
                    deny all;
                }
                # Uploads must be authorized by the CDB API before nginx
                # writes the file; reads stay unauthenticated.
                if ($request_method = PUT) {
                    rewrite ^ /_dbstore_put$uri last;
                }
            }

            # Upload handler: PUT /dbstore/... requests land here via the
            # rewrite above (not reachable from outside). The file is written
            # by the WebDAV module only after auth_request approves the
            # request; nginx answers 201/204 on success.
            location /_dbstore_put/dbstore/ {
                internal;
                auth_request /_cdb_auth_decision;
                # Strip the /_dbstore_put prefix so the file is stored under
                # the same path it is later served from.
                rewrite ^/_dbstore_put(/.*)$ $1 break;
                root /usr/share/nginx/html;
                dav_methods PUT;
                # Create missing intermediate directories on upload.
                create_full_put_path on;
                dav_access group:rw all:r;
            }

            # Authorization subrequest for uploads: asks the CDB API whether
            # this request may proceed. The API returns 200 to allow; on PUT
            # it validates the client's JWT (Authorization header, forwarded
            # automatically) and the permission plugin, answering 401/403 to
            # deny — nginx then rejects the upload with that status.
            location = /_cdb_auth_decision {
                internal;
                # Auth decisions must never be served from the proxy cache.
                proxy_cache off;
                proxy_pass http://django/api/cdb_rest/auth/decision;
                # The decision needs headers only, not the uploaded file body.
                proxy_pass_request_body off;
                proxy_set_header Content-Length "";
                # The API bases its decision on the original method and URI.
                proxy_set_header X-Original-Method $request_method;
                proxy_set_header X-Original-URI $request_uri;
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "npdbchart.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: nginx
  template:
    metadata:
      labels:
        {{- include "npdbchart.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: nginx
    spec:
      #securityContext:
      #  runAsUser: 101
      #  fsGroup: 1000860000
      volumes:
        - name: files-volume
          {{- if .Values.pvc_payload_server }}
          persistentVolumeClaim:
            claimName: {{ .Values.pvc_payload_server }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: nginx-conf-volume
          configMap:
            name: {{ include "npdbchart.fullname" . }}-nginx-conf
        - name: nginx-cache
          # Memory-backed (tmpfs) so cache hits are RAM reads, not disk.
          # sizeLimit must exceed proxy_cache_path max_size (500m) to leave
          # room for temp files; tmpfs usage counts as pod memory.
          emptyDir:
            medium: Memory
            sizeLimit: 640Mi
          # Previous disk-backed cache volume:
          # emptyDir: {}
        - name: nginx-pid
          emptyDir: {}
      containers:
        - name: nginx
          image: "image-registry.openshift-image-registry.svc:5000/{{ .Values.project }}/{{ include "npdbchart.fullname" . }}-nginx:{{ .Values.nginx_docker_image | splitList ":" | last }}"
          ports:
            - containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: files-volume
              mountPath: /usr/share/nginx/html
              subPath: {{ .Values.subPath }}
            - name: nginx-conf-volume
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-pid
              mountPath: /var/run
          imagePullPolicy: IfNotPresent
---
kind: Service
apiVersion: v1
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  selector:
    {{- include "npdbchart.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
---
{{- if .Values.use_ingress }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  annotations:
    route.openshift.io/termination: edge
    route.openshift.io/insecureEdgeTerminationPolicy: Allow
spec:
  rules:
    - host: {{ .Values.appname }}.{{ .Values.domain }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "npdbchart.fullname" . }}-nginx
                port:
                  name: http
{{- else }}
kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: {{ include "npdbchart.fullname" . }}-nginx
  labels:
    {{- include "npdbchart.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
  annotations:
    haproxy.router.openshift.io/disable_cookies: "true"
spec:
  host: {{ .Values.appname }}.{{ .Values.domain }}
  to:
    kind: Service
    name: {{ include "npdbchart.fullname" . }}-nginx
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Allow
{{- end }}
